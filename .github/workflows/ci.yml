name: Compile IRBEM

on:
  push:
    branches: [GFZ]
  pull_request:
    branches: [GFZ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install gfortran
        run: |
          sudo apt-get install gfortran

      - name: Show gfortran version
        run: gfortran --version

      - name: Build
        shell: bash
        # Execute the build.  You can specify a specific target with "--target <NAME>"
        run: |
          make OS=linux64 ENV=gfortran64 all
          make OS=linux64 ENV=gfortran64 install

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python wrapper
        run: |
          cd python
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest

      - name: Run Python tests
        run: |
          pytest

  build-osx:
    runs-on: macos-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Show gfortran version
        run: |
          FC=$(compgen -c gfortran | sort -V | tail -n1)
          $FC --version

      - name: Build
        shell: bash
        run: |
          make OS=osx64 ENV=github all
          make OS=osx64 ENV=github install

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python wrapper
        run: |
          cd python
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest

      - name: Run Python tests
        run: |
          pytest

  build-win:
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Add gfortran to PATH
        shell: bash
        run: |
          # $env:PATH = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;$env:PATH"
          # gfortran --version
          echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH
          echo "C:\msys64\usr\bin" >> $GITHUB_PATH
          echo $(gfortran --version)

      - name: Build
        shell: bash
        run: |
          make OS=win64 ENV=gfortran64 all
          make OS=win64 ENV=gfortran64 install

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python wrapper
        run: |
          cd python
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest

      - name: Run Python tests
        run: |
          pytest
